<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面不存在</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f4efe7;
            color: #1f1b16;
        }

        main {
            width: min(520px, calc(100% - 2rem));
            padding: 40px 28px;
            border-radius: 24px;
            background: rgba(255, 252, 247, 0.92);
            box-shadow: 0 24px 60px rgba(85, 52, 29, 0.12);
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 4rem;
        }

        p {
            color: #6d6255;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 18px;
            border-radius: 999px;
            background: #c65d2e;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main>
        <h1>404</h1>
        <p>当前页面不存在。请返回首页继续访问。</p>
        <a href="/">返回首页</a>
    </main>
</body>
</html>
